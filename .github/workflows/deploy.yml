name: Build and push image

on:
  push:
    branches: [main]
  # Start a build by hand, from the Actions tab or `gh workflow run deploy.yml`.
  # Added after an Actions outage swallowed three pushes: the fix was already on
  # main, no run had been created for it, and without a manual trigger the only
  # way to rebuild the image was to invent an empty commit.
  workflow_dispatch:

jobs:
  # Runs before the image is built, and the build waits on it. Until this
  # existed, a push to main built and pushed :latest unconditionally and
  # Watchtower deployed it within the poll interval — so a red suite reached
  # production without anything having to go wrong twice.
  #
  # No database is needed: Prisma is faked through test/routeApp.js and every
  # route test drives supertest against an in-process app.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # In step with the Dockerfile. The npm that writes package-lock.json
          # has to be the npm that reads it here, for the same reason the
          # Dockerfile pins node 24 and says so at length.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run

  # The same code against a real Postgres, built from nothing by the
  # migrations. Three things only this job can see:
  #
  # - The migrations build the database. They could not until the baseline:
  #   `migrate deploy` on an empty database failed at the fourth.
  # - What they build is exactly schema.prisma. A column added to the schema
  #   without a migration is how the deployed image and the database drifted
  #   apart before — see the Dockerfile — and it fails here instead of at boot.
  # - The regressions a faked Prisma passes: selects that omit fields, a
  #   transaction Postgres aborts, a filter that is silently not there.
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: thor
          POSTGRES_PASSWORD: thor
          POSTGRES_DB: thorcode
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U thor -d thorcode"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://thor:thor@localhost:5432/thorcode
      INTEGRATION_DATABASE_URL: postgresql://thor:thor@localhost:5432/thorcode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - run: npx vitest run test/integration

  build:
    needs: [test, database]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/esemdis/thorcode:latest
