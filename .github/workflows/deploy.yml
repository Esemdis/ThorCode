name: Build and push image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Start a build by hand, from the Actions tab or `gh workflow run deploy.yml`.
  # Added after an Actions outage swallowed three pushes: the fix was already on
  # main, no run had been created for it, and without a manual trigger the only
  # way to rebuild the image was to invent an empty commit.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Runs before the image is built, and the build waits on it. Until this
  # existed, a push to main built and pushed :latest unconditionally and
  # Watchtower deployed it within the poll interval — so a red suite reached
  # production without anything having to go wrong twice.
  #
  # No database is needed: Prisma is faked through test/routeApp.js and every
  # route test drives supertest against an in-process app.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # In step with the Dockerfile. The npm that writes package-lock.json
          # has to be the npm that reads it here, for the same reason the
          # Dockerfile pins node 24 and says so at length.
          node-version: 24
          cache: npm
      - run: npm ci
      # Blocks the deploy on purpose: a high or critical advisory in what ships
      # fails this job, and build waits on it. Until this existed nothing looked,
      # and main carried a critical and four highs (THO-973). Production
      # dependencies only, so a dev tool's advisory never holds back a deploy.
      # The fix for a red run is a bump (Dependabot opens one), not removing
      # this step. An unreachable audit endpoint fails it too.
      - run: npm audit --omit=dev --audit-level=high
      - run: npx vitest run

  # The same code against a real Postgres, built from nothing by the
  # migrations. Three things only this job can see:
  #
  # - The migrations build the database. They could not until the baseline:
  #   `migrate deploy` on an empty database failed at the fourth.
  # - What they build is exactly schema.prisma. A column added to the schema
  #   without a migration is how the deployed image and the database drifted
  #   apart before — see the Dockerfile — and it fails here instead of at boot.
  # - The regressions a faked Prisma passes: selects that omit fields, a
  #   transaction Postgres aborts, a filter that is silently not there.
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: thor
          POSTGRES_PASSWORD: thor
          POSTGRES_DB: thorcode
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U thor -d thorcode"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://thor:thor@localhost:5432/thorcode
      INTEGRATION_DATABASE_URL: postgresql://thor:thor@localhost:5432/thorcode
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - run: npx vitest run test/integration

  build:
    needs: [test, database]
    # Only main publishes :latest, which Watchtower deploys, migrations and
    # all. A manual run can be started on any branch and a pull request runs
    # this file too; this condition keeps both from publishing.
    #
    # It guards against the accident, not against intent (THO-987). A manual
    # run uses the branch's own copy of this file, and a pull request runs it
    # as merged with main, so a branch's edit to it takes effect in both. A
    # branch's copy can drop this line and declare `packages: write`, and
    # GitHub grants it, so anyone who can push a change to this file can
    # publish :latest from an unmerged branch. Nothing in a workflow file can
    # close that.
    #
    # And a branch cut before this condition existed (THO-563, b185eb3,
    # 2026-10-26) still has the old file: `workflow_dispatch` and a build job
    # that publishes :latest with no ref check. A manual run on one publishes
    # weeks-old code, which Watchtower boots against a schema migrated past
    # it, with no edit to anything. That was 18 of the 54 branches on origin
    # on 2026-11-12. Pull requests are not affected that way: their merged
    # copy has this condition unless the branch edits it.
    #
    # The agent pipeline's credential is a GitHub App user token whose App has
    # the Workflows permission (the `workflow` scope, for a personal access
    # token): a branch changing this file was accepted. The guards, in an
    # order that never stops a deploy:
    #   1. Required, both halves: take the Workflows permission (`workflow`
    #      scope) away from agent credentials, so a branch cannot edit this
    #      file, and take away their ability to run workflows (Actions:
    #      write, and any tool that runs one), so nobody can start a manual
    #      run on a stale branch. (A classic PAT can dispatch with plain
    #      `repo`, so only the App's Actions permission can be withdrawn on
    #      its own.)
    #   2. Delete the branches cut before this condition, or have them merge
    #      main, so none still carries the old file.
    #   3. An Environment restricted to main, holding the publish token.
    #   4. A change that names that Environment here and logs in with its
    #      token (`environment:` is left out until the Environment exists, or
    #      every deploy would stop).
    #   5. Only then, the GHCR package's Actions access for this repo set to
    #      Read, so GITHUB_TOKEN can no longer push it. Set before 4, it
    #      refuses main's own push below: no image, no deploy, no migrations.
    #   6. Watchtower following a tag only that job moves.
    # A branch rule on main requiring code-owner review (.github/CODEOWNERS)
    # gates the merge, not the pull request's run, which publishes before
    # anyone reviews.
    # A fork's pull request gets no secrets and a read-only token
    # (`pull_request`, not `pull_request_target`), so the hole is same-repo
    # branches only.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/esemdis/thorcode:latest
          # The commit this image was built from, so munin-dashboard can say
          # which merge is live (THO-711).
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
