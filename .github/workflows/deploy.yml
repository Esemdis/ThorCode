name: Build and push image

on:
  push:
    branches: [main]
  # Start a build by hand, from the Actions tab or `gh workflow run deploy.yml`.
  # Added after an Actions outage swallowed three pushes: the fix was already on
  # main, no run had been created for it, and without a manual trigger the only
  # way to rebuild the image was to invent an empty commit.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/esemdis/thorcode:latest
